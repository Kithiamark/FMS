version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fms_prod}
      - POSTGRES_USER=${POSTGRES_USER:-fms_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  web:
    build: .
    command: gunicorn fms_core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-fms_user}:${POSTGRES_PASSWORD:-secure_password}@db:5432/${POSTGRES_DB:-fms_prod}}
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A fms_core worker -l info
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-fms_user}:${POSTGRES_PASSWORD:-secure_password}@db:5432/${POSTGRES_DB:-fms_prod}}
    depends_on:
      - db
      - redis

  ai_service:
    build: ./ai_service
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
